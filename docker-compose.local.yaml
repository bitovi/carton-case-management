# One-shot local run: builds, installs, seeds the DB, and starts client + server.
# Use when you just want the app running in Docker without attaching an editor.
#
#   docker compose -f docker-compose.local.yaml up --build -d
#
# Client: http://localhost:5173   Server: http://localhost:3001
services:
  app:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - .:/workspaces/carton-case-management:cached
      # Named volumes prevent host node_modules from mounting (avoids architecture/platform conflicts)
      - node_modules:/workspaces/carton-case-management/node_modules
      - client_node_modules:/workspaces/carton-case-management/packages/client/node_modules
      - server_node_modules:/workspaces/carton-case-management/packages/server/node_modules
      - shared_node_modules:/workspaces/carton-case-management/packages/shared/node_modules
    working_dir: /workspaces/carton-case-management
    command: sh -c "npm install && npm run setup && npm run dev"
    environment:
      - NODE_ENV=development
      # Relative to the Prisma schema dir (packages/shared/prisma/) -> packages/server/db/dev.db
      - DATABASE_URL=file:../../server/db/dev.db
    ports:
      - '5173:5173'
      - '3001:3001'

volumes:
  node_modules:
  client_node_modules:
  server_node_modules:
  shared_node_modules:
