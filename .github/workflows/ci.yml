name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Single source of truth for the Node version - matches the node:24 images used by
          # Dockerfile, Dockerfile.test and .devcontainer/Dockerfile.
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma types
        run: npm run db:generate

      - name: Run linter
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      # The .github/instructions/*.instructions.md files are generated from the package
      # CLAUDE.md files. This fails if someone edited a CLAUDE.md without running
      # `npm run sync:agent-docs`, which would leave Copilot reading stale guidance.
      - name: Check generated agent docs are in sync
        run: npm run sync:agent-docs:check

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Single source of truth for the Node version - matches the node:24 images used by
          # Dockerfile, Dockerfile.test and .devcontainer/Dockerfile.
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma types
        run: npm run db:generate

      - name: Run unit tests
        run: npm test

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    env:
      # Prisma resolves a relative file: path against the schema directory
      # (packages/shared/prisma/), not the repo root - so this is packages/server/db/dev.db.
      # Must match .env.example and the compose files, or CI tests a different database layout
      # than everyone else.
      DATABASE_URL: file:../../server/db/dev.db
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Single source of truth for the Node version - matches the node:24 images used by
          # Dockerfile, Dockerfile.test and .devcontainer/Dockerfile.
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma types
        run: npm run db:generate

      - name: Setup database
        run: npm run db:setup

      # test:e2e:ci, not test:e2e: the step above already installed the browser, and on a bare
      # runner `--with-deps` there is the right call. test:e2e would just re-check it.
      - name: Run E2E tests
        run: npm run test:e2e:ci

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
