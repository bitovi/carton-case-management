# Production-style image (root Dockerfile). The SQLite file is persisted in the `app-data`
# volume, so its mount path must stay in sync with the Dockerfile WORKDIR.
#
#   docker compose up --build -d
#
# Only the server port is published; the client is served as static files.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=production
      # Relative to the Prisma schema dir (packages/shared/prisma/) -> packages/server/db/dev.db
      - DATABASE_URL=file:../../server/db/dev.db
      - MOCK_USER_EMAIL=${MOCK_USER_EMAIL:-alex.morgan@carton.com}
    volumes:
      # Must match the image WORKDIR (see Dockerfile) so the SQLite file is actually persisted
      - app-data:/workspaces/carton-case-management/packages/server/db

volumes:
  app-data:
